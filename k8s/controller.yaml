apiVersion: v1
kind: Secret
metadata: {name: agent-reader-token, namespace: trust-ctl, annotations: {kubernetes.io/service-account.name: agent-reader}}
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: controller-data, namespace: trust-ctl}
spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 5Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: controller, namespace: trust-ctl}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: controller}}
  template:
    metadata: {labels: {app: controller}}
    spec:
      serviceAccountName: controller
      nodeSelector: {kubernetes.io/hostname: mylab-node002}
      containers:
      - name: controller
        image: python:3.12-slim
        command: [sh, -c, "pip install -q --root-user-action=ignore kubernetes requests matplotlib && exec python -u /app/controller.py"]
        env:
        - {name: MODE, value: "A,control,B"}
        - {name: BASELINE_MIN, value: "30"}
        - {name: DRY_FAULTS, value: "F13"}
        - {name: DRY_MODEL, value: "A"}
        - name: OPENROUTER_API_KEY
          valueFrom: {secretKeyRef: {name: openrouter, key: api-key}}
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 768Mi}}
        volumeMounts:
        - {name: app, mountPath: /app}
        - {name: data, mountPath: /data}
        - {name: agent, mountPath: /var/run/agent, readOnly: true}
      volumes:
      - {name: app, configMap: {name: controller-code}}
      - {name: data, persistentVolumeClaim: {claimName: controller-data}}
      - {name: agent, secret: {secretName: agent-reader-token}}
---
apiVersion: v1
kind: Service
metadata: {name: controller, namespace: trust-ctl}
spec:
  type: NodePort
  selector: {app: controller}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
